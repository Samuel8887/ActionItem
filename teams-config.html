<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add Together to Teams</title><link rel="stylesheet" href="styles.css">
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.2/dist/umd/supabase.min.js"></script><script defer src="https://res.cdn.office.net/teams-js/2.31.0/js/MicrosoftTeams.min.js"></script><script defer src="config.js"></script><script defer src="teams-config.js"></script></head>
<body><main id="app"><section class="tg-auth"><div class="tg-brand"><span class="tg-logo">↗</span>together.</div><h1>Add your shared list.</h1><p>Sign in and choose the group for this channel.</p><form id="config-signin"><label class="tg-field">Email<input id="config-email" type="email" required autocomplete="email"></label><label class="tg-field">Password<input id="config-password" type="password" required autocomplete="current-password"></label><button type="submit" class="tg-primary">Sign in</button></form><div id="config-picker" hidden><label class="tg-field">Group<select id="config-group" aria-label="Choose group"></select></label><p>Choose Save in Teams to add this group’s action items.</p></div><p id="config-status" role="status"></p><a href="index.html" target="_blank" rel="noopener">Open Together to create an account or a group</a></section></main></body></html>
