<body><main id="app"><section class="tg-auth"><div class="tg-brand"><span class="tg-logo">↗</span>together.</div><h1>Your team, one tab.</h1><p>Generate a Teams app package for your published Together website.</p><form id="package-form"><label class="tg-field">Published website URL<input id="site-url" type="url" required placeholder="https://yourname.github.io/together/"></label><label class="tg-field">Developer / team name<input id="developer" required value="My team" maxlength="32"></label><button type="submit" class="tg-primary">Download Teams app ZIP</button></form><p id="package-status" role="status"></p><p>Upload the generated ZIP as a custom app in Teams, then add Together as a channel tab. Your Teams administrator may need to allow or upload custom apps.</p><a href="index.html">Back to Together</a></section></main></body></html>
